lidar_3d_pointcloud:
  ros__parameters:
    scan_topic: "/scan"
    imu_a_topic: "/imu_a"
    imu_b_topic: "/imu_b"
    output_topic: "/point_cloud_3d"
    output_flat_scan_topic: "/scan_flat"
    pose_topic: "/lidar_pose"
    frame_id: "laser"
    reference_frame: "base_link"
    flat_scan_enabled: true
    flat_scan_slice_min_z_m: 0.005  # include points from 5 mm above ground
    flat_scan_slice_max_z_m: 0.390  # include points up to 390 mm above ground
    flat_scan_ground_offset_z_m: 0.308  # pitch pivot is 308 mm above ground

    stepper_enabled: true
    stepper_step_pin: 6
    stepper_dir_pin: 12
    stepper_enable_pin: -1
    stepper_enable_active_low: true
    stepper_dir_invert: true
    stepper_test_steps: 100
    stepper_steps_per_rev: 32           # 28BYJ-48 geared stepper: 32 steps per motor revolution
    stepper_gear_ratio: 64.0            # Internal 1:64 gearbox on the 28BYJ-48
    stepper_microsteps: 1               # 28BYJ-48 on a ULN2003 is not microstepped in this setup.
                                       # Using 2 here doubles the commanded motion and makes a 45° request behave like 90°.
    stepper_step_delay_s: 0.001
    stepper_max_rate_hz: 500.0
    stepper_min_move_rad: 0.002
    stepper_min_pitch_deg: -45.0  # lower scan limit in degrees, relative to the measured mechanical home.
    stepper_max_pitch_deg: 45.0   # upper scan limit in degrees, relative to the measured mechanical home.
    stepper_scan_limit_tolerance_deg: 1.5  # reversal tolerance around limits; slightly wider band reduces endpoint chatter.
    stepper_scan_step_deg: 2.0  # base sweep increment per control tick.
    stepper_scan_ease_zone_deg: 12.0  # distance from endpoints where speed tapers for ease-in/ease-out.
    stepper_scan_min_speed_scale: 0.35  # minimum speed fraction at the very edge of the ease zone.
    stepper_scan_pi_kp: 0.7  # proportional gain for tracking the sweep target with relative pitch feedback.
    stepper_scan_pi_ki: 0.03  # integral gain to remove steady-state tracking bias.
    stepper_scan_drift_k: 0.025  # lower gain to avoid drift over-correction while scanning in motion.
    stepper_scan_drift_max_step_deg: 0.04  # cap bias change per control tick to prevent runaway bias.
    stepper_scan_endpoint_correction_enabled: true
    stepper_scan_endpoint_tolerance_deg: 0.8  # if measured pitch misses an end by more than this, hold and correct before reversing.
    stepper_scan_endpoint_window_deg: 3.0  # engage endpoint correction only near the ends of travel.
    stepper_scan_endpoint_max_step_deg: 0.8  # cap each endpoint correction nudge to avoid abrupt kicks.
    stepper_scan_endpoint_recover_enabled: true
    stepper_scan_endpoint_recover_window_deg: 0.6  # if the model says it is already at the end but IMU says it is still short, trigger recovery.
    stepper_scan_endpoint_recover_step_deg: 0.5  # temporary internal re-anchor size used to force a few extra steps into the endpoint.
    stepper_scan_endpoint_recover_max_cycles: 2  # keep endpoint recovery brief to avoid multi-second stalls at hard limits.
    stepper_scan_top_endpoint_confirm_cycles: 2  # short confirmation to filter spikes without top-end dwell.
    stepper_scan_pi_max_step_deg: 2.5  # max PI command magnitude per loop.
    stepper_scan_pi_integral_limit_deg: 6.0  # anti-windup clamp for PI integral term.
    stepper_scan_escape_step_deg: 3.0  # immediate inward target offset after endpoint reversal.
    output_pitch_sign: 1.0  # legacy fallback for pitch sign; overridden by the specific cloud/pose pitch signs below.
    output_cloud_pitch_sign: 1.0  # +1/-1 pitch sign used when rotating scan into 3D cloud.
    output_pose_pitch_sign: -1.0  # +1/-1 pitch sign used when publishing lidar pose orientation.
    output_pose_roll_offset_deg: 0.0  # additive roll offset for published pose frame.
    output_pose_pitch_offset_deg: 0.0  # additive pitch offset for published pose frame.
    output_pose_yaw_offset_deg: 180.0  # additive yaw offset for pose orientation.
    output_cloud_roll_offset_deg: 0.0  # additive roll offset for cloud transform.
    output_cloud_pitch_offset_deg: 0.0  # additive pitch offset for cloud transform.
    output_cloud_yaw_offset_deg: 180.0  # additive yaw offset for cloud transform.
    output_mount_offset_x_m: 0.0  # lidar-to-pivot translation in meters, X axis in the sensor/pivot frame.
    output_mount_offset_y_m: 0.0  # lidar-to-pivot translation in meters, Y axis in the sensor/pivot frame.
    output_mount_offset_z_m: 0.0485  # lidar is 48.5 mm above the pitch pivot point.
    output_pivot_offset_x_m: -0.035  # base_link -> pitch pivot X offset (matches static TF base_link->laser).
    output_pivot_offset_y_m: 0.0  # base_link -> pitch pivot Y offset.
    output_pivot_offset_z_m: 0.308  # base_link -> pitch pivot Z offset.
    output_cloud_sign_x: -1.0  # +1/-1 for cloud X axis (forward/backward inversion).
    output_cloud_sign_y: -1.0  # +1/-1 for cloud Y axis (left/right inversion).
    output_cloud_sign_z: 1.0  # +1/-1 for cloud Z axis (up/down inversion).
    stepper_home_pitch_deg: 0.0   # target IMU-relative pitch at home (0 = lidar IMU level with robot-body IMU).
    stepper_use_live_zero: true   # if true, wait for IMUs and actively home to stepper_home_pitch_deg.
            # if false, skip active homing and use stepper_home_pitch_deg as static center.

dual_imu_publisher:
  ros__parameters:
    i2c_bus: 1
    sensor_a_address: 106
    sensor_b_address: 107
    imu_a_topic: "/imu_a"
    imu_b_topic: "/imu_b"
    frame_id_a: "imu_a_link"
    frame_id_b: "imu_b_link"
    publish_rate_hz: 100.0
